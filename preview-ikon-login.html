<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preview ikon login</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="src/style.css"><style>
.preview-controls{padding:12px 20px;background:#fff;border-bottom:1px solid #e7e2d8;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.preview-controls button{font:inherit;font-weight:700;padding:8px 12px;border:1px solid #aaa;border-radius:8px;background:white;cursor:pointer}.preview-controls button[aria-pressed=true]{background:#212121;color:white;border-color:#212121}.preview-controls button:focus-visible{outline:3px solid #946200;outline-offset:2px}.preview-logo{display:flex;align-items:center;gap:10px}.preview-logo svg{width:36px;height:36px;color:#ffd21a;flex:none}.preview-note{color:#626464;font-size:12px}.login-layout{min-height:calc(100dvh - 65px)}
</style></head><body>
<div class="preview-controls" role="group" aria-label="Pilih alternatif ikon"><span>Preview ikon:</span><button type="button" aria-pressed="true" data-icon="road">01 Jalur</button><button type="button" aria-pressed="false" data-icon="wheel">02 Setir</button><button type="button" aria-pressed="false" data-icon="calendar">03 Kalender</button><span class="preview-note">Nama hanya contoh · formulir tidak aktif</span></div>
<svg width="0" height="0" aria-hidden="true" style="position:absolute"><symbol id="road" viewBox="0 0 48 48"><path d="M6 41c2-8 25-8 28-16S15 19 15 11c0-4 5-6 12-7" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/><circle cx="36" cy="5" r="4" fill="currentColor"/></symbol><symbol id="wheel" viewBox="0 0 48 48"><circle cx="24" cy="24" r="19" fill="none" stroke="currentColor" stroke-width="5"/><circle cx="24" cy="24" r="5" fill="none" stroke="currentColor" stroke-width="4"/><path d="M7 17l12 5m10 0 12-5M24 29v14" fill="none" stroke="currentColor" stroke-width="4"/></symbol><symbol id="calendar" viewBox="0 0 48 48"><rect x="5" y="8" width="38" height="35" rx="5" fill="none" stroke="currentColor" stroke-width="4"/><path d="M5 18h38M14 4v9M34 4v9M14 26h3m5 0h3M14 33h3M22 41c4-8 10-11 20-12" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></symbol></svg>
<main class="login-layout login-vertical"><aside class="login-intro"><div class="auth-wordmark preview-logo"><svg aria-hidden="true"><use href="#road"></use></svg><div>Jagonyetir<span aria-hidden="true">.</span></div></div><div class="login-intro-content"><div class="login-intro-copy"><h2>Operasional<br><span class="login-highlight">lebih tertata.</span></h2><p>Atur jadwal latihan, murid, instruktur, dan mobil dalam satu tempat.</p></div></div><div class="login-road-area" aria-hidden="true"><div class="login-route"><svg class="login-road" viewBox="0 0 560 180"><path class="login-road-edge" d="M -80 260 C -80 180 -40 150 40 150 C 200 150 200 70 360 70 H 640"/><path class="login-road-surface" d="M -80 260 C -80 180 -40 150 40 150 C 200 150 200 70 360 70 H 640"/></svg></div></div></aside><div class="login-form-area"><section class="panel panel-pad auth-panel"><h1>Masuk</h1><p>Masuk untuk melanjutkan.</p><form class="auth-form" onsubmit="return false"><label for="email">Email</label><input id="email" type="email" placeholder="nama@email.com"><label for="password">Kata sandi</label><input id="password" type="password" placeholder="Masukkan kata sandi"><button class="btn btn-primary" type="button">Masuk</button></form><p class="auth-switch">Belum punya akun? <span class="inline-link">Daftar gratis</span></p></section></div></main>
<script>document.querySelectorAll('[data-icon]').forEach(button=>button.addEventListener('click',()=>{document.querySelector('.preview-logo use').setAttribute('href','#'+button.dataset.icon);document.querySelectorAll('[data-icon]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)))}));</script></body></html>
